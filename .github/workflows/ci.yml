# CI runs automatically on every push and pull request. It installs the
# dependencies and runs the tests on a clean checkout of your repo, so a
# red X on GitHub usually means something is broken for your teammates even
# if it works on your machine -- most often a file you forgot to commit, or
# a package you installed locally but never added to package.json.
#
# You should not normally need to edit this file. New packages go in
# package.json (use `npm install --save-dev <name>`, then commit both
# package.json and package-lock.json).

name: CI

on:
  push:
  pull_request:
  # workflow_dispatch lets you also start a run by hand from the Actions
  # tab on GitHub.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
